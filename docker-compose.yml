services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: newtonite
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d newtonite"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://ops:ops@postgres:5432/newtonite?schema=public
      DEMO_PASSWORD: Demo@1234
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["node", "dist/index.js"]
    environment:
      DATABASE_URL: postgresql://ops:ops@postgres:5432/newtonite?schema=public
      JWT_SECRET: demo-only-change-me-before-any-real-use
      JWT_EXPIRES_IN: 8h
      DEMO_PASSWORD: Demo@1234
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://ops:ops@postgres:5432/newtonite?schema=public
      NODE_ENV: production
      OUTBOX_POLL_MS: "1000"
      OUTBOX_LOCK_TIMEOUT_SEC: "120"
      OUTBOX_BATCH_SIZE: "10"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
